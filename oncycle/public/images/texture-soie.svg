<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5e2340"/><stop offset=".5" stop-color="#3a1424"/><stop offset="1" stop-color="#6d2a4a"/>
  </linearGradient>
  <filter id="silk" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0012 0.004" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="140" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="28"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#g)"/>
<g filter="url(#silk)" fill="none" stroke-linecap="round">
  <path d="M-200 260 C 250 60, 650 520, 1050 250 S 1650 260, 1900 140" stroke="#e9b3c8" stroke-opacity=".55" stroke-width="120"/>
  <path d="M-200 520 C 350 330, 800 760, 1200 500 S 1700 560, 1900 430" stroke="#c77a9a" stroke-opacity=".45" stroke-width="180"/>
  <path d="M-200 800 C 300 600, 900 1000, 1300 740 S 1700 800, 1900 680" stroke="#1f0811" stroke-opacity=".75" stroke-width="200"/>
  <path d="M-200 60 C 500 -80, 900 260, 1800 20" stroke="#1f0811" stroke-opacity=".6" stroke-width="150"/>
</g>
<g filter="url(#soft)" fill="none" stroke-linecap="round">
  <path d="M-100 300 C 300 130, 680 500, 1060 280 S 1650 280, 1800 180" stroke="#fde6ee" stroke-opacity=".35" stroke-width="14"/>
  <path d="M-100 560 C 380 380, 820 740, 1210 540 S 1700 580, 1800 470" stroke="#fde6ee" stroke-opacity=".22" stroke-width="10"/>
</g>
</svg>
